name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  verify:
    name: Analyze, guards, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages

      - name: Comment guard (PRD section 4.1)
        run: |
          dart run packages/offsignal_tools/bin/check_comments.dart \
            packages/offsignal_core/lib \
            packages/offsignal_core/test \
            packages/offsignal_app/lib

      - name: Core codec tests
        working-directory: packages/offsignal_core
        run: dart test

      - name: Tooling tests
        working-directory: packages/offsignal_tools
        run: dart test

      - name: App tests and asset guard
        working-directory: packages/offsignal_app
        run: flutter test test/core test/features

  goldens:
    name: Golden tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Golden tests
        working-directory: packages/offsignal_app
        run: flutter test test/golden

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: packages/offsignal_app/test/golden/failures

  android:
    name: Signed release APK
    needs: [verify, goldens]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    defaults:
      run:
        working-directory: packages/offsignal_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/offsignal-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/offsignal-release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Assert the APK requests no INTERNET permission
        run: |
          MANIFEST=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$MANIFEST" || MANIFEST=$(find build -name AndroidManifest.xml -path '*merged_manifest*release*' | head -1)
          echo "Checking $MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::Release manifest requests INTERNET; PRD section 12.1 forbids it."
            grep -n 'uses-permission' "$MANIFEST"
            exit 1
          fi
          grep -n 'uses-permission' "$MANIFEST"

      - uses: actions/upload-artifact@v4
        with:
          name: offsignal-apk
          path: packages/offsignal_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
          else
            gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
              --title "OffSignal $VERSION" \
              --notes "Sideload the APK, or use OffSignal in your browser. No Play Store account needed."
          fi

  web:
    name: Web build and deploy
    needs: [verify, goldens]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: packages/offsignal_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL || 'privacy.html' }} \
            --dart-define=SOURCE_URL=${{ vars.SOURCE_URL || format('{0}/{1}', github.server_url, github.repository) }} \
            --dart-define=APK_DOWNLOAD_URL=${{ vars.APK_DOWNLOAD_URL || format('{0}/{1}/releases/latest', github.server_url, github.repository) }}

      - uses: actions/upload-artifact@v4
        with:
          name: offsignal-web
          path: packages/offsignal_app/build/web

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/offsignal_app/build/web
            --project-name=offsignal
            --branch=${{ github.head_ref || github.ref_name }}
          workingDirectory: .
