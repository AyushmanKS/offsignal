name: offsignal_app
description: Move a file, note, or link between phones using only light.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  offsignal_core:
    path: ../offsignal_core

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.4
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.1
  go_router: ^16.2.4
  intl: any
  lottie: ^3.3.2
  mime: ^2.0.0
  mobile_scanner: ^7.1.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.5
  share_plus: ^12.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  wakelock_plus: ^1.4.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_master.png"
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon_master.png"
    background_color: "#0A0E14"
    theme_color: "#4FD8FF"

flutter_native_splash:
  color: "#0A0E14"
  image: "assets/icon/splash_logo_dark.png"
  color_dark: "#0A0E14"
  image_dark: "assets/icon/splash_logo_dark.png"
  web: false
